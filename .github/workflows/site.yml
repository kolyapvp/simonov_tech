name: Site CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 scripts/check_site.py
      - run: python3 -m unittest discover -s tests -v

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, simonov-tech-production-82]
    timeout-minutes: 5
    concurrency:
      group: simonov-tech-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://simonov-tech.ru/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Проверка сайта
        run: python3 scripts/check_site.py
      - name: Публикация и проверка версии
        run: python3 scripts/deploy.py "$GITHUB_SHA"
      - name: Проверка публичного HTTPS
        run: |
          published_sha="$(curl --fail --silent --show-error --max-time 15 --retry 3 --retry-all-errors https://simonov-tech.ru/version.txt)"
          if [ "$published_sha" != "$GITHUB_SHA" ]; then
            echo "Публичный сайт отвечает другой версией: $published_sha"
            exit 1
          fi
