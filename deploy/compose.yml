services:
  web:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to the verified image digest}
    container_name: simonov-tech-web
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:8098:80'
    volumes:
      - /srv/simonov-tech:/srv/site:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

networks:
  proxy:
    external: true
    name: proxy
